# LOVE DAY - nginx 정적 파일 캐시·압축 (server { ... } 블록 안 location ~ \.php$ 보다 위에 넣기)
#  - uploads 사진·음악: 이름이 무작위(32자)라 내용이 안 바뀜 → 1년
#  - assets 안 ?v= 가 붙은 압축본: 지문이 바뀌면 주소가 바뀜 → 1년, 그 밖 assets: 1시간
#  - 넣은 뒤: sudo nginx -t && sudo systemctl reload nginx
gzip on; gzip_comp_level 5; gzip_min_length 1024; gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

location ~* ^/invite/uploads/.+\.(webp|jpe?g|png|gif|mp3|m4a)$ {
    expires 365d; add_header Cache-Control "public, max-age=31536000, immutable"; access_log off; try_files $uri =404;
}
location ~* ^/invite/assets/.+\.(js|css|svg|webp|png|jpe?g|woff2?|json)$ {
    if ($arg_v) { add_header Cache-Control "public, max-age=31536000, immutable"; }
    if ($arg_v = "") { add_header Cache-Control "public, max-age=3600"; }
    access_log off; try_files $uri =404;
}
