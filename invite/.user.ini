; 1019z9 세션을 12시간 남김 (PHP 기본 24분이면 관리자 화면·에디터를 띄워 둔 사이 세션이 지워져 'CSRF 검증 실패'가 났음)
; PHP-FPM/CGI 서버에서만 읽음 (mod_php면 무시돼도 문제없음). 관리자 자동 로그아웃(30분·연장)은 admin_guard.php가 따로 함.
; 주의: 우분투는 세션 파일을 php.ini 값(기본 24분)으로 지우는 크론(sessionclean)이 따로 있어서 서버 php.ini도 43200으로 바꿔야 함 (tools/server/tuning.md)
session.gc_maxlifetime = 43200
; 1019z14 업로드 한도 - 이 서버 php.ini는 2M이라 배경음악·큰 사진이 막혔음. 이 폴더(invite)에만 적용 (같은 서버의 다른 사이트는 그대로)
upload_max_filesize = 20M
post_max_size = 24M
